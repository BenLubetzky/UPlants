<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .zone { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
      .zsub { font-size: 12.5px; fill: #4b5563; }
      .name { font-size: 14px; font-weight: 700; fill: #111827; }
      .desc { font-size: 11.5px; fill: #4b5563; }
      .port { font-size: 13px; font-weight: 700; fill: #1d4ed8; font-family: Menlo, Consolas, monospace; }
      .lbl  { font-size: 11.5px; fill: #111827; }
      .lblb { font-size: 11.5px; font-weight: 700; fill: #111827; }
      .num  { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .net  { font-size: 11.5px; fill: #374151; font-style: italic; }
      .warn { font-size: 12px; font-weight: 700; fill: #b91c1c; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">UPlants: where each part runs and how a request flows</text>

  <!-- ===================== ZONE 1: PHONE (30-290) ===================== -->
  <rect x="30" y="72" width="260" height="488" rx="18" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="160" y="102" text-anchor="middle" class="zone" fill="#15803d">PHONE / EMULATOR</text>
  <text x="160" y="122" text-anchor="middle" class="zsub">Android app · Kotlin · MVVM</text>

  <rect x="62" y="140" width="196" height="342" rx="26" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <rect x="136" y="150" width="48" height="6" rx="3" fill="#d1d5db"/>

  <rect x="82" y="172" width="156" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="160" y="193" text-anchor="middle" class="name">Screen</text>
  <text x="160" y="210" text-anchor="middle" class="desc">Jetpack Compose UI</text>
  <line x1="160" y1="222" x2="160" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="82" y="242" width="156" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="160" y="263" text-anchor="middle" class="name">ViewModel</text>
  <text x="160" y="280" text-anchor="middle" class="desc">screen state + logic</text>
  <line x1="160" y1="292" x2="160" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="82" y="312" width="156" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="160" y="333" text-anchor="middle" class="name">Repository</text>
  <text x="160" y="350" text-anchor="middle" class="desc">Retrofit (HTTP client)</text>

  <rect x="82" y="392" width="156" height="50" rx="8" fill="#fefce8" stroke="#facc15"/>
  <text x="160" y="413" text-anchor="middle" class="name">Login token</text>
  <text x="160" y="430" text-anchor="middle" class="desc">kept in DataStore</text>

  <text x="160" y="512" text-anchor="middle" class="warn">No database keys in the app</text>
  <text x="160" y="530" text-anchor="middle" class="desc">(anyone can unpack an APK)</text>

  <!-- ===================== ZONE 2: YOUR PC (410-790) ===================== -->
  <rect x="410" y="72" width="380" height="488" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="600" y="102" text-anchor="middle" class="zone" fill="#1d4ed8">YOUR PC</text>
  <text x="600" y="122" text-anchor="middle" class="zsub">Docker Compose · one container per service</text>

  <rect x="440" y="140" width="320" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="456" y="162" class="name">users-service</text>
  <text x="456" y="181" class="desc">log-in, profiles, search, follows</text>
  <text x="746" y="171" text-anchor="end" class="port">:8080</text>

  <rect x="440" y="204" width="320" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="456" y="226" class="name">content-service</text>
  <text x="456" y="245" class="desc">posts, search, feed, publish</text>
  <text x="746" y="235" text-anchor="end" class="port">:8081</text>

  <rect x="440" y="268" width="320" height="54" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="456" y="290" class="name">interactions-service</text>
  <text x="456" y="309" class="desc">comments, likes, stars, views, stats</text>
  <text x="746" y="299" text-anchor="end" class="port">:8082</text>

  <rect x="440" y="332" width="320" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="456" y="354" class="name">favorites-service</text>
  <text x="456" y="373" class="desc">favourite lists</text>
  <text x="746" y="363" text-anchor="end" class="port">:8083</text>

  <rect x="440" y="396" width="320" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="456" y="418" class="name">messaging-service</text>
  <text x="456" y="437" class="desc">messages, sharing posts</text>
  <text x="746" y="427" text-anchor="end" class="port">:8084</text>

  <rect x="440" y="470" width="320" height="54" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="456" y="492" class="name">.env file</text>
  <text x="456" y="511" class="desc">Supabase URL + secret key · never in Git</text>

  <!-- ===================== ZONE 3: SUPABASE (910-1170) ===================== -->
  <rect x="910" y="72" width="260" height="488" rx="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="1040" y="102" text-anchor="middle" class="zone" fill="#6d28d9">SUPABASE CLOUD</text>
  <text x="1040" y="122" text-anchor="middle" class="zsub">supabase.co · on the internet</text>

  <rect x="935" y="150" width="210" height="74" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1040" y="180" text-anchor="middle" class="name">Auth</text>
  <text x="1040" y="200" text-anchor="middle" class="desc">accounts, passwords, tokens</text>

  <rect x="935" y="258" width="210" height="128" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="1040" y="288" text-anchor="middle" class="name">Postgres database</text>
  <text x="1040" y="308" text-anchor="middle" class="desc">all tables (users, posts, likes…)</text>
  <line x1="955" y1="322" x2="1125" y2="322" stroke="#ddd6fe"/>
  <text x="1040" y="342" text-anchor="middle" class="desc">triggers update counters</text>
  <text x="1040" y="360" text-anchor="middle" class="desc">and create notifications</text>

  <rect x="935" y="420" width="210" height="84" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1040" y="448" text-anchor="middle" class="name">Storage</text>
  <text x="1040" y="468" text-anchor="middle" class="desc">photos, videos, audio files</text>
  <text x="1040" y="486" text-anchor="middle" class="desc">(uploaded by content-service)</text>

  <!-- ===================== ARROWS: PHONE <-> PC ===================== -->
  <!-- 1: request -->
  <line x1="240" y1="322" x2="436" y2="284" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <circle cx="330" cy="305" r="10" fill="#15803d"/>
  <text x="330" y="309" text-anchor="middle" class="num">1</text>
  <text x="350" y="242" text-anchor="middle" class="lblb">request</text>
  <text x="350" y="257" text-anchor="middle" class="lbl">HTTP · JSON</text>
  <text x="350" y="272" text-anchor="middle" class="lbl">+ login token</text>

  <!-- 5: answer -->
  <line x1="436" y1="316" x2="240" y2="352" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <circle cx="330" cy="335" r="10" fill="#15803d"/>
  <text x="330" y="339" text-anchor="middle" class="num">5</text>
  <text x="350" y="376" text-anchor="middle" class="lblb">answer</text>
  <text x="350" y="391" text-anchor="middle" class="lbl">JSON</text>

  <!-- ===================== ARROWS: PC <-> SUPABASE ===================== -->
  <!-- 2: check token -->
  <line x1="762" y1="284" x2="933" y2="190" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <circle cx="800" cy="263" r="10" fill="#1d4ed8"/>
  <text x="800" y="267" text-anchor="middle" class="num">2</text>
  <text x="862" y="250" class="lblb">check</text>
  <text x="862" y="264" class="lblb">token</text>

  <!-- 3: read / write -->
  <line x1="762" y1="296" x2="933" y2="312" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <circle cx="885" cy="307" r="10" fill="#1d4ed8"/>
  <text x="885" y="311" text-anchor="middle" class="num">3</text>
  <text x="830" y="289" text-anchor="middle" class="lblb">read / write</text>

  <!-- 4: result -->
  <line x1="933" y1="346" x2="762" y2="310" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <circle cx="885" cy="336" r="10" fill="#1d4ed8"/>
  <text x="885" y="340" text-anchor="middle" class="num">4</text>
  <text x="830" y="352" text-anchor="middle" class="lblb">result</text>

  <!-- ===================== NETWORK LABELS ===================== -->
  <line x1="160" y1="578" x2="600" y2="578" stroke="#9ca3af" stroke-width="1"/>
  <line x1="600" y1="578" x2="1040" y2="578" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="160" cy="578" r="4" fill="#15803d"/>
  <circle cx="600" cy="578" r="4" fill="#1d4ed8"/>
  <circle cx="1040" cy="578" r="4" fill="#6d28d9"/>

  <text x="380" y="598" text-anchor="middle" class="net">local network</text>
  <text x="380" y="615" text-anchor="middle" class="code">emulator → 10.0.2.2:8080–8084</text>
  <text x="380" y="631" text-anchor="middle" class="code">real phone → PC's Wi-Fi IP</text>

  <text x="820" y="598" text-anchor="middle" class="net">internet · HTTPS</text>
  <text x="820" y="615" text-anchor="middle" class="code">services use the secret key</text>

  <!-- ===================== EXAMPLE ===================== -->
  <rect x="30" y="650" width="1140" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="48" y="672" class="lbl"><tspan class="lblb">Example, liking a post:</tspan>  (1) the app sends PUT …/reaction to interactions-service (:8082) with the token;  (2) the service asks Auth who it is;</text>
  <text x="48" y="692" class="lbl">(3) it saves the like in Postgres, where a trigger adds 1 to like_count and notifies the author;  (4) the database confirms;  (5) the service answers and the app highlights the heart.</text>
</svg>
