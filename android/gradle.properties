org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# --- UPlants backend connection ---------------------------------------------
# true  = in-memory fake login (works with no server; demo account: demo / password123).
#         Only login is faked: feed and posts still need the real services.
# false = real services at uplants.apiHost
uplants.useFakeBackend=false
# Where the services run; the app adds each service's port (users 8080, content 8081,
# interactions 8082, favorites 8083, messaging 8084).
# 10.0.2.2 is your PC as seen from the Android emulator.
# On a physical phone, use your PC's LAN IP instead, e.g. http://192.168.1.20
uplants.apiHost=http://10.0.2.2
