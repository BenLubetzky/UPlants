org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- UPlants backend connection ---------------------------------------------
# true  = in-memory fake backend (works with no server; demo account: demo / password123)
# false = real REST API at uplants.apiBaseUrl
uplants.useFakeBackend=true
# 10.0.2.2 is the host machine as seen from the Android emulator.
# On a physical phone, use your computer's LAN IP, e.g. http://192.168.1.20:8080/
uplants.apiBaseUrl=http://10.0.2.2:8080/
